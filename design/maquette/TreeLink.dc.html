<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;align-items:center;width:64px;flex-shrink:0;padding-top:5px">
  <div style="font-size:9.5px;color:#a89e89;height:13px;line-height:13px;white-space:nowrap">{{ info.years }}</div>
  <div style="display:flex;align-items:center;width:100%;height:24px">
    <div style="flex:1;border-top:{{ info.lineCss }}"></div>
    <div style="width:22px;height:22px;border-radius:50%;background:#fffefa;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;color:{{ info.statusColor }};border:1.5px solid {{ info.statusColor }}">{{ info.glyph }}</div>
    <div style="flex:1;border-top:{{ info.lineCss }}"></div>
  </div>
  <div style="font-size:8.5px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;height:13px;line-height:13px;white-space:nowrap;color:{{ info.statusColor }}">{{ info.statusLabel }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:64,&quot;height&quot;:64}}"></script>
</body>
</html>
