<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:flex-start;justify-content:center">
  <div style="width:214px;flex-shrink:0;display:flex;align-items:flex-start;justify-content:flex-end">
    <sc-if value="{{ hasEx }}" hint-placeholder-val="{{ false }}">
      <dc-import name="TreeNode" p="{{ ex }}" accent="{{ accent }}" hint-size="150px,60px"></dc-import>
      <dc-import name="TreeLink" info="{{ ex.link }}" accent="{{ accent }}" hint-size="64px,60px"></dc-import>
    </sc-if>
  </div>
  <dc-import name="TreeNode" p="{{ a }}" accent="{{ accent }}" hint-size="150px,60px"></dc-import>
  <dc-import name="TreeLink" info="{{ link }}" accent="{{ accent }}" hint-size="64px,60px"></dc-import>
  <dc-import name="TreeNode" p="{{ b }}" accent="{{ accent }}" hint-size="150px,60px"></dc-import>
  <div style="width:214px;flex-shrink:0"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:792,&quot;height&quot;:70}}"></script>
</body>
</html>
