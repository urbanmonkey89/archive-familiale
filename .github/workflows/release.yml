# Compile les installeurs Windows et Linux et publie une « Release » GitHub.
# Déclenchement : pousser une étiquette de version, par exemple :
#   git tag v0.2.0 && git push origin v0.2.0
# Les applications déjà installées verront la nouvelle version au prochain lancement.
name: Publication

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm test

      # Compilation « à part » : en cas d'échec, la fin du journal est publiée en annotation,
      # lisible sur la page de la compilation sans être connecté à GitHub.
      - name: Compilation
        id: build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          npm run tauri build -- --ci 2>&1 | tee build.log

      - name: Afficher l'erreur de compilation
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          msg=$(grep -vE '^\s*(Compiling|Downloaded|Downloading) ' build.log | tail -n 60 | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Erreur de compilation::$msg"

      # Re-fabrique les installeurs (rapide : déjà compilé) et publie la Release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Archive familiale ${{ github.ref_name }}'
          releaseBody: "Téléchargez l'installeur correspondant à votre ordinateur : le fichier « …setup.exe » pour Windows, « .AppImage » ou « .deb » pour Linux."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
